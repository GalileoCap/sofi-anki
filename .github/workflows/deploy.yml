# Two sites (A17): the app goes to GalileoCap/anki, whose Pages site is anki.smplworks.net, and
# this repo's Pages site, galileocap.github.io/sofi-anki/, serves the page that hands data over.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The session-kit gates run on the owner's machine only: the kit is not installed here.
      - name: Lint and build
        run: pnpm lint && pnpm build

      - name: Push the app to anki.smplworks.net
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ANKI_DEPLOY_KEY }}
          external_repository: GalileoCap/anki
          publish_branch: gh-pages
          publish_dir: dist
          cname: anki.smplworks.net

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-handover

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
