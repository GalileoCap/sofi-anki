# Two sites (A17): the app goes to GalileoCap/anki, whose Pages site is anki.smplworks.net, and
# this repo's Pages site, galileocap.github.io/sofi-anki/, serves the page that hands data over.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.new-address.outputs.up }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The session-kit gates run on the owner's machine only: the kit is not installed here.
      # The Google OAuth client for sync (A19), a repository variable: a client id is public. Without
      # it the build offers no sync.
      - name: Lint and build
        run: pnpm lint && pnpm build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # The token server that renews sign-ins (A20), deployed apart from this workflow.
          VITE_AUTH_SERVER: https://auth.anki.smplworks.net

      - name: Push the app to anki.smplworks.net
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ANKI_DEPLOY_KEY }}
          external_repository: GalileoCap/anki
          publish_branch: gh-pages
          publish_dir: dist
          cname: anki.smplworks.net

      # The old address forwards to the new one, so it takes the hand-over page only once the new
      # one serves the app. Until then its last deployment, the app itself, stays.
      - name: Does anki.smplworks.net serve the app?
        id: new-address
        run: |
          if curl -sf https://anki.smplworks.net/manifest.webmanifest | grep -q '"start_url":"/"'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::anki.smplworks.net does not serve the app yet; the old address keeps its last deployment"
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-handover

  deploy:
    needs: build
    if: needs.build.outputs.up == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
