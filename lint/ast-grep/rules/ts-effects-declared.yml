id: ts-effects-declared
language: typescript
severity: error
message: >-
  An export of `src/effects` names its effects in an `@effects` JSDoc tag.
  One without effects belongs in `src/core`.
files:
  - src/effects/**/*.ts
rule:
  kind: export_statement
  has:
    any:
      - kind: function_declaration
      - kind: lexical_declaration
  not:
    follows:
      kind: comment
      regex: "@effects"
      stopBy: neighbor
